# MTG Engine — API + simulation workers, sharing a data volume.
#
#   cp deploy/.env.example deploy/.env     # then edit: MTG_API_KEYS is required
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --scale worker=3
#
# The API refuses to bind a public interface without MTG_API_KEYS set, because
# POST /simulate spawns a 4 GB JVM for 10-60 minutes. See deploy_plan.md.
services:
  web:
    build:
      context: ../web
      dockerfile: ../deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: /engine
        # Inlined into the client bundle at BUILD time — rebuild to rotate.
        # Use ONE key here (MTG_API_KEYS may be a comma-separated list).
        NEXT_PUBLIC_API_KEY: ${WEB_API_KEY:?set WEB_API_KEY in deploy/.env (one of MTG_API_KEYS)}
        # Baked into the routes manifest at build — a runtime env is ignored.
        ENGINE_ORIGIN: http://api:8484
    ports:
      # The public face. 80 by default; put Caddy/nginx in front for TLS.
      - "${WEB_PORT:-80}:3000"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      # Loopback by default; terminate TLS in a reverse proxy in front of this.
      - "${MTG_PORT:-127.0.0.1:8484}:8484"
    volumes:
      - mtg-data:/data
    environment:
      MTG_DATA_DIR: /data
      MTG_EMBEDDED_WORKER: "0"        # workers are separate containers here
      MTG_BIND: "0.0.0.0"             # inside the container; the port map scopes it
      MTG_API_KEYS: ${MTG_API_KEYS:?set MTG_API_KEYS in deploy/.env}
      MTG_ALLOW_ORIGIN: ${MTG_ALLOW_ORIGIN:-*}
      MTG_SIM_PER_HOUR: ${MTG_SIM_PER_HOUR:-6}
      MTG_SIM_MAX_GAMES: ${MTG_SIM_MAX_GAMES:-64}
      MTG_SIM_MAX_QUEUED: ${MTG_SIM_MAX_QUEUED:-3}
      MTG_READ_PER_MIN: ${MTG_READ_PER_MIN:-240}
      MTG_ASK_PER_HOUR: ${MTG_ASK_PER_HOUR:-30}
      MTG_COACH_PER_HOUR: ${MTG_COACH_PER_HOUR:-20}
      # Game-story display switches (engine/game_story.py), set from the
      # week-3 knockout / turning-point hand audit without a code change.
      #   MTG_TURNING_POINT   swing = "Biggest swing" (not audited, default),
      #                       audited = "Turning point", off = held
      #   MTG_KNOCKOUT_DETAIL on = cause and killer shown (default), off = hidden
      MTG_TURNING_POINT: ${MTG_TURNING_POINT:-swing}
      MTG_KNOCKOUT_DETAIL: ${MTG_KNOCKOUT_DETAIL:-on}
      # Playtesters' flags-only keys ("label:key,label:key"): each can POST
      # /flags and nothing else. Optional; empty = only admin keys can flag,
      # which preflight reports as deliberately off. Read by the api only.
      MTG_FLAG_KEYS: ${MTG_FLAG_KEYS:-}
      MTG_FLAG_PER_HOUR: ${MTG_FLAG_PER_HOUR:-60}
      # Rules-assistant generation; absent = /ask degrades to plain search.
      MTG_LLM_API_KEY: ${MTG_LLM_API_KEY:-}
      MTG_LLM_MODEL: ${MTG_LLM_MODEL:-claude-haiku-4-5}
      # Mirrors of the WORKER's settings. The API builds no plans and runs no
      # Forge here (MTG_EMBEDDED_WORKER=0); these exist so deploy/preflight.py,
      # which runs in this container, can assert them: the plan_feedback nudge
      # is off, and the newest result comes from at least the pinned shim.
      # Same .env variables and defaults as the worker below; keep them equal.
      MTG_PLAN_FEEDBACK_APPLY: ${MTG_PLAN_FEEDBACK_APPLY:-0}
      SIMLAB_SHIM_REF: ${SIMLAB_SHIM_REF:-v0.16.0}
      MTG_PLAN_VERSION: ${MTG_PLAN_VERSION:-1}
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8484/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
      args:
        # The simlab-forge-shim release baked into this image. Releases pin a
        # TAG: a branch moves under you, and Dockerfile.worker clones with
        # `git clone -b`, which takes a branch or a tag but never a bare
        # commit. The tag must already exist in the shim repo, or the build
        # fails at the ref fetch (and the running stack keeps serving).
        # Bumping the pin: tag the shim, then change this default, the api's
        # mirror above and SHIM_FLOOR in deploy/preflight.py in one commit.
        # See deploy/HOSTING.md "Releases pin a shim tag".
        SIMLAB_SHIM_REF: ${SIMLAB_SHIM_REF:-v0.16.0}
    volumes:
      - mtg-data:/data
    environment:
      MTG_DATA_DIR: /data
      # plan_feedback nudges (engine/plan_feedback.py). Read HERE: run_sim
      # builds the plans in this container. Unvalidated, so off; only the
      # exact value "1" turns them on, and preflight fails while it is.
      MTG_PLAN_FEEDBACK_APPLY: ${MTG_PLAN_FEEDBACK_APPLY:-0}
      # Deck-plan version (engine/deck_plan.py). 1 = the plans every study
      # before the tutoring hotfix measured; 2 = the hotfix data (pilot
      # lines narrowed to win-band, threatLines, graveyardTargets, fix
      # flags), which needs shim >= 0.17.0. Flipped only at a release whose
      # gate passed (G0a); preflight refuses 2 on an older shim.
      MTG_PLAN_VERSION: ${MTG_PLAN_VERSION:-1}
      # Optional per-flag override for version-2 plans (a G0a fail-branch
      # arm). Empty = every flag on.
      MTG_PLAN_FIX: ${MTG_PLAN_FIX:-}
    deploy:
      resources:
        limits:
          # Forge is invoked with -Xmx4g; give the container headroom above that.
          memory: ${MTG_WORKER_MEM:-5g}
          cpus: "${MTG_WORKER_CPUS:-2}"
    restart: unless-stopped

volumes:
  # Must be a real filesystem with working POSIX locks — the job queue is SQLite.
  # Network/9p mounts fail with "disk I/O error". See deploy_plan.md.
  mtg-data:
